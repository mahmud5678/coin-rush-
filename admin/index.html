<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Rush Admin</title><style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
}

h1{
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:0;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  margin-top:8px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.login{
  background:#3b82f6;
  color:white;
}

.approve{
  background:#22c55e;
  color:white;
}

.reject{
  background:#ef4444;
  color:white;
}

.request{
  background:#374151;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
  overflow-wrap:anywhere;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:20px;
}

.stat{
  background:#374151;
  padding:15px;
  border-radius:10px;
}

.stat h2{
  margin:8px 0 0;
}

.full{
  grid-column:1/-1;
}

.status{
  font-weight:bold;
}

.method{
  display:inline-block;
  background:#111827;
  padding:6px 10px;
  border-radius:8px;
  font-weight:bold;
}

.wallet{
  background:#111827;
  padding:10px;
  border-radius:8px;
  overflow-wrap:anywhere;
}

#loginMessage{
  text-align:center;
  min-height:20px;
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}
</style></head><body><div class="container"><h1>🛠️ Coin Rush Admin</h1><div class="card" id="loginBox"><h3>Admin Login</h3><input
type="password"
id="adminKey"
placeholder="Admin key"
autocomplete="off"

«»

<button
type="button"
class="login"
id="loginButton">
🔐 LOGIN
</button>

<p id="loginMessage"></p></div><div class="card" id="panel" style="display:none"><h2>📊 Dashboard</h2><div class="stats"><div class="stat">
<strong>👥 Total Users</strong>
<h2 id="totalUsers">-</h2>
</div><div class="stat">
<strong>⏳ Pending</strong>
<h2 id="pendingCount">-</h2>
</div><div class="stat">
<strong>✅ Approved</strong>
<h2 id="approvedCount">-</h2>
</div><div class="stat">
<strong>❌ Rejected</strong>
<h2 id="rejectedCount">-</h2>
</div><div class="stat full">
<strong>💰 Total Withdrawal Coins</strong>
<h2 id="totalCoins">-</h2>
</div></div><h2>💰 Withdrawal Management</h2><button
type="button"
id="refreshButton">
🔄 REFRESH
</button>

<h3>⏳ Pending Withdrawals</h3><div id="pendingRequests">
Loading...
</div><h3>📜 Withdrawal History</h3><div id="history">
Loading...
</div></div></div><script>

const API =
  "https://coin-rush-nxeb.onrender.com";

let adminKey = "";


/* =========================
   EVENTS
========================= */

document
  .getElementById("loginButton")
  .addEventListener("click", login);

document
  .getElementById("refreshButton")
  .addEventListener("click", refreshAll);


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   METHOD NAME
========================= */

function getMethodName(method){

  if(method === "bkash"){
    return "bKash";
  }

  if(method === "telegram_wallet"){
    return "Telegram Wallet";
  }

  return "Unknown";

}


/* =========================
   LOGIN
========================= */

async function login(){

  const input =
    document.getElementById("adminKey");

  const message =
    document.getElementById("loginMessage");

  adminKey =
    input.value.trim();

  if(!adminKey){

    message.innerText =
      "❌ Admin key required.";

    return;
  }

  message.innerText =
    "⏳ Checking...";

  try{

    const response =
      await fetch(
        API + "/api/admin/withdrawals/all",
        {
          method:"GET",
          headers:{
            "x-admin-key":adminKey
          }
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      message.innerText =
        "❌ Wrong admin key.";

      return;
    }

    document
      .getElementById("loginBox")
      .style.display = "none";

    document
      .getElementById("panel")
      .style.display = "block";

    await refreshAll();

  }catch(error){

    console.error(error);

    message.innerText =
      "❌ Connection error.";

  }

}


/* =========================
   REFRESH ALL
========================= */

async function refreshAll(){

  await loadStats();
  await loadRequests();

}


/* =========================
   STATS
========================= */

async function loadStats(){

  try{

    const response =
      await fetch(
        API + "/api/admin/stats",
        {
          headers:{
            "x-admin-key":adminKey
          }
        }
      );

    const data =
      await response.json();

    if(!response.ok){
      return;
    }

    const s =
      data.stats;

    document
      .getElementById("totalUsers")
      .innerText =
      s.total_users;

    document
      .getElementById("pendingCount")
      .innerText =
      s.pending;

    document
      .getElementById("approvedCount")
      .innerText =
      s.approved;

    document
      .getElementById("rejectedCount")
      .innerText =
      s.rejected;

    document
      .getElementById("totalCoins")
      .innerText =
      s.total_withdrawal_coins;

  }catch(error){

    console.error(
      "Stats error:",
      error
    );

  }

}


/* =========================
   WITHDRAWALS
========================= */

async function loadRequests(){

  const pendingBox =
    document.getElementById(
      "pendingRequests"
    );

  const historyBox =
    document.getElementById(
      "history"
    );

  pendingBox.innerHTML =
    "⏳ Loading...";

  historyBox.innerHTML =
    "⏳ Loading...";

  try{

    const response =
      await fetch(
        API + "/api/admin/withdrawals/all",
        {
          headers:{
            "x-admin-key":adminKey
          }
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      pendingBox.innerHTML =
        "❌ Authentication failed.";

      historyBox.innerHTML =
        "";

      return;
    }

    const withdrawals =
      data.withdrawals || [];

    const pending =
      withdrawals.filter(
        item =>
          item.status === "pending"
      );

    const history =
      withdrawals.filter(
        item =>
          item.status !== "pending"
      );


    /* =====================
       PENDING
    ===================== */

    if(pending.length === 0){

      pendingBox.innerHTML = `
        <div class="request">
          <strong>
            ✅ No pending withdrawals.
          </strong>
        </div>
      `;

    }else{

      pendingBox.innerHTML =
        pending
          .map(item => {

            const method =
              getMethodName(
                item.method
              );

            const payment =
              escapeHtml(
                item.payment_number
              );

            const paymentLabel =
              item.method ===
              "telegram_wallet"
                ? "Wallet Address"
                : "bKash Number";

            return `

              <div class="request">

                <p>
                  <strong>ID:</strong>
                  ${escapeHtml(item.id)}
                </p>

                <p>
                  <strong>Telegram ID:</strong>
                  ${escapeHtml(
                    item.telegram_id
                  )}
                </p>

                <p>
                  <strong>Amount:</strong>
                  ${escapeHtml(
                    item.amount
                  )}
                  coins
                </p>

                <p>
                  <strong>Method:</strong>
                  <span class="method">
                    ${escapeHtml(method)}
                  </span>
                </p>

                <p>
                  <strong>
                    ${paymentLabel}:
                  </strong>
                </p>

                <div class="wallet">
                  ${payment}
                </div>

                <p>
                  <strong>Date:</strong>
                  ${escapeHtml(
                    item.created_at
                  )}
                </p>

                <p class="status">
                  ⏳ PENDING
                </p>

                <button
                  type="button"
                  class="approve"
                  data-id="${escapeHtml(item.id)}">
                  ✅ APPROVE
                </button>

                <button
                  type="button"
                  class="reject"
                  data-id="${escapeHtml(item.id)}">
                  ❌ REJECT
                </button>

              </div>

            `;

          })
          .join("");


      pendingBox
        .querySelectorAll(".approve")
        .forEach(button => {

          button.addEventListener(
            "click",
            () =>
              approve(
                button.dataset.id
              )
          );

        });


      pendingBox
        .querySelectorAll(".reject")
        .forEach(button => {

          button.addEventListener(
            "click",
            () =>
              reject(
                button.dataset.id
              )
          );

        });

    }


    /* =====================
       HISTORY
    ===================== */

    if(history.length === 0){

      historyBox.innerHTML = `
        <div class="request">
          No withdrawal history yet.
        </div>
      `;

    }else{

      historyBox.innerHTML =
        history
          .map(item => {

            const method =
              getMethodName(
                item.method
              );

            const payment =
              escapeHtml(
                item.payment_number
              );

            const paymentLabel =
              item.method ===
              "telegram_wallet"
                ? "Wallet Address"
                : "bKash Number";

            const status =
              item.status ===
              "approved"
                ? "✅ APPROVED"
                : "❌ REJECTED";

            return `

              <div class="request">

                <p>
                  <strong>ID:</strong>
                  ${escapeHtml(item.id)}
                </p>

                <p>
                  <strong>Telegram ID:</strong>
                  ${escapeHtml(
                    item.telegram_id
                  )}
                </p>

                <p>
                  <strong>Amount:</strong>
                  ${escapeHtml(
                    item.amount
                  )}
                  coins
                </p>

                <p>
                  <strong>Method:</strong>
                  <span class="method">
                    ${escapeHtml(method)}
                  </span>
                </p>

                <p>
                  <strong>
                    ${paymentLabel}:
                  </strong>
                </p>

                <div class="wallet">
                  ${payment}
                </div>

                <p class="status">
                  ${status}
                </p>

                <p>
                  <strong>Requested:</strong>
                  ${escapeHtml(
                    item.created_at
                  )}
                </p>

                <p>
                  <strong>Processed:</strong>
                  ${escapeHtml(
                    item.processed_at ||
                    "N/A"
                  )}
                </p>

              </div>

            `;

          })
          .join("");

    }

  }catch(error){

    console.error(error);

    pendingBox.innerHTML = `
      <div class="request">
        ❌ Connection error.
      </div>
    `;

    historyBox.innerHTML =
      "";

  }

}


/* =========================
   APPROVE
========================= */

async function approve(id){

  if(!confirm(
    "Approve this withdrawal?"
  )){
    return;
  }

  try{

    const response =
      await fetch(
        API +
        "/api/admin/withdrawals/" +
        encodeURIComponent(id) +
        "/approve",
        {
          method:"POST",
          headers:{
            "x-admin-key":adminKey
          }
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      alert(
        "❌ " +
        (
          data.error ||
          "Approve failed"
        )
      );

      return;
    }

    alert(
      "✅ Withdrawal approved."
    );

    await refreshAll();

  }catch(error){

    console.error(error);

    alert(
      "❌ Connection error."
    );

  }

}


/* =========================
   REJECT
========================= */

async function reject(id){

  if(!confirm(
    "Reject this withdrawal? Coins will be refunded."
  )){
    return;
  }

  try{

    const response =
      await fetch(
        API +
        "/api/admin/withdrawals/" +
        encodeURIComponent(id) +
        "/reject",
        {
          method:"POST",
          headers:{
            "x-admin-key":adminKey
          }
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      alert(
        "❌ " +
        (
          data.error ||
          "Reject failed"
        )
      );

      return;
    }

    alert(
      "✅ Withdrawal rejected and coins refunded."
    );

    await refreshAll();

  }catch(error){

    console.error(error);

    alert(
      "❌ Connection error."
    );

  }

}

</script></body>
  </html>
