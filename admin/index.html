<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Rush Admin</title><style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
}

h1{
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:0;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  margin-top:8px;
  font-weight:bold;
  cursor:pointer;
}

.login{
  background:#3b82f6;
  color:white;
}

.approve{
  background:#22c55e;
  color:white;
}

.reject{
  background:#ef4444;
  color:white;
}

.request{
  background:#374151;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}
</style></head><body><div class="container"><h1>🛠️ Coin Rush Admin</h1><div class="card" id="loginBox"><h3>Admin Login</h3><input
type="password"
id="adminKey"
placeholder="Admin key"

«»

<button class="login" onclick="login()">
🔐 LOGIN
</button><p id="loginMessage"></p></div><div class="card" id="panel" style="display:none"><h2>💰 Withdrawal Requests</h2><button onclick="loadRequests()">
🔄 REFRESH REQUESTS
</button><div id="requests">
Loading...
</div></div></div><script>

const API = "https://coin-rush-nxeb.onrender.com";

let adminKey = "";

function login(){

  adminKey =
    document.getElementById("adminKey").value.trim();

  if(!adminKey){

    document.getElementById("loginMessage").innerText =
      "❌ Admin key required.";

    return;
  }

  loadRequests();

}

async function loadRequests(){

  const box =
    document.getElementById("requests");

  box.innerHTML = "⏳ Loading...";

  try{

    const response = await fetch(
      API + "/api/admin/withdrawals",
      {
        headers:{
          "x-admin-key": adminKey
        }
      }
    );

    const data = await response.json();

    if(!response.ok){

      document.getElementById("loginMessage").innerText =
        "❌ Wrong admin key.";

      return;
    }

    document.getElementById("loginBox").style.display =
      "none";

    document.getElementById("panel").style.display =
      "block";

    if(!data.withdrawals || data.withdrawals.length === 0){

      box.innerHTML = `
        <div class="request">
          <strong>✅ No pending withdrawals.</strong>
        </div>
      `;

      return;
    }

    box.innerHTML = data.withdrawals.map(item => `

      <div class="request">

        <p><strong>ID:</strong> ${item.id}</p>

        <p><strong>Telegram ID:</strong> ${item.telegram_id}</p>

        <p><strong>Amount:</strong> ${item.amount} coins</p>

        <p><strong>Method:</strong> ${item.method}</p>

        <p><strong>Payment Number:</strong> ${item.payment_number}</p>

        <p><strong>Status:</strong> ${item.status}</p>

        <p><strong>Date:</strong> ${item.created_at}</p>

        <button class="approve"
          onclick="approve(${item.id})">
          ✅ APPROVE
        </button>

        <button class="reject"
          onclick="reject(${item.id})">
          ❌ REJECT
        </button>

      </div>

    `).join("");

  }catch(error){

    box.innerHTML = `
      <div class="request">
        ❌ Connection error.
      </div>
    `;

  }

}

function approve(id){

  alert(
    "Approve API এখনো backend-এ যোগ করা হয়নি।"
  );

}

function reject(id){

  alert(
    "Reject API এখনো backend-এ যোগ করা হয়নি।"
  );

}

</script></body>
</html>
