<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Rush Admin</title><style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
}

h1{
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:0;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  margin-top:8px;
  font-weight:bold;
  cursor:pointer;
}

.login{
  background:#3b82f6;
  color:white;
}

.approve{
  background:#22c55e;
  color:white;
}

.reject{
  background:#ef4444;
  color:white;
}

.request{
  background:#374151;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}

.status{
  font-weight:bold;
}
</style></head><body><div class="container"><h1>🛠️ Coin Rush Admin</h1><div class="card" id="loginBox"><h3>Admin Login</h3><input
type="password"
id="adminKey"
placeholder="Admin key"

«»

<button class="login" onclick="login()">
🔐 LOGIN
</button><p id="loginMessage"></p></div><div class="card" id="panel" style="display:none"><h2>💰 Withdrawal Management</h2>
  <div id="stats" style="
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:20px;
">

  <div class="request">
    <strong>👥 Total Users</strong>
    <h2 id="totalUsers">-</h2>
  </div>

  <div class="request">
    <strong>⏳ Pending</strong>
    <h2 id="pendingCount">-</h2>
  </div>

  <div class="request">
    <strong>✅ Approved</strong>
    <h2 id="approvedCount">-</h2>
  </div>

  <div class="request">
    <strong>❌ Rejected</strong>
    <h2 id="rejectedCount">-</h2>
  </div>

  <div class="request" style="grid-column:1/-1">
    <strong>💰 Total Withdrawal Coins</strong>
    <h2 id="totalCoins">-</h2>
  </div>

  </div>
  <button onclick="loadRequests()">
🔄 REFRESH
</button><h3>⏳ Pending Withdrawals</h3><div id="pendingRequests">
Loading...
</div><h3>📜 Withdrawal History</h3><div id="history">
Loading...
</div></div></div><script>

const API = "https://coin-rush-nxeb.onrender.com";

let adminKey = "";


function login(){

  adminKey =
    document.getElementById("adminKey").value.trim();

  if(!adminKey){

    document.getElementById("loginMessage").innerText =
      "❌ Admin key required.";

    return;
  }

  loadRequests();
  loadStats();

  adminKey =
    document.getElementById("adminKey").value.trim();

  if(!adminKey){

    document.getElementById("loginMessage").innerText =
      "❌ Admin key required.";

    return;
  }

  loadRequests();

}

async function loadStats(){

  try{

    const response = await fetch(
      API + "/api/admin/stats",
      {
        headers:{
          "x-admin-key": adminKey
        }
      }
    );

    const data = await response.json();

    if(!response.ok) return;

    const s = data.stats;

    document.getElementById("totalUsers").innerText =
      s.total_users;

    document.getElementById("pendingCount").innerText =
      s.pending;

    document.getElementById("approvedCount").innerText =
      s.approved;

    document.getElementById("rejectedCount").innerText =
      s.rejected;

    document.getElementById("totalCoins").innerText =
      s.total_withdrawal_coins;

  }catch(error){

    console.log("Stats error:", error);

  }

}
async function loadRequests(){

  const pendingBox =
    document.getElementById("pendingRequests");

  const historyBox =
    document.getElementById("history");

  pendingBox.innerHTML = "⏳ Loading...";
  historyBox.innerHTML = "⏳ Loading...";

  try{

    const response = await fetch(
      API + "/api/admin/withdrawals/all",
      {
        headers:{
          "x-admin-key": adminKey
        }
      }
    );

    const data = await response.json();

    if(!response.ok){

      document.getElementById("loginMessage").innerText =
        "❌ Wrong admin key.";

      return;
    }

    document.getElementById("loginBox").style.display =
      "none";

    document.getElementById("panel").style.display =
      "block";


    const withdrawals = data.withdrawals || [];


    const pending =
      withdrawals.filter(item => item.status === "pending");

    const history =
      withdrawals.filter(item => item.status !== "pending");


    if(pending.length === 0){

      pendingBox.innerHTML = `
        <div class="request">
          <strong>✅ No pending withdrawals.</strong>
        </div>
      `;

    }else{

      pendingBox.innerHTML = pending.map(item => `

        <div class="request">

          <p><strong>ID:</strong> ${item.id}</p>

          <p><strong>Telegram ID:</strong> ${item.telegram_id}</p>

          <p><strong>Amount:</strong> ${item.amount} coins</p>

          <p><strong>Method:</strong> ${item.method}</p>

          <p><strong>Payment Number:</strong> ${item.payment_number}</p>

          <p><strong>Date:</strong> ${item.created_at}</p>

          <p class="status">
            Status: ⏳ ${item.status}
          </p>

          <button
            class="approve"
            onclick="approve(${item.id})">
            ✅ APPROVE
          </button>

          <button
            class="reject"
            onclick="reject(${item.id})">
            ❌ REJECT
          </button>

        </div>

      `).join("");

    }


    if(history.length === 0){

      historyBox.innerHTML = `
        <div class="request">
          No withdrawal history yet.
        </div>
      `;

    }else{

      historyBox.innerHTML = history.map(item => `

        <div class="request">

          <p><strong>ID:</strong> ${item.id}</p>

          <p><strong>Telegram ID:</strong> ${item.telegram_id}</p>

          <p><strong>Amount:</strong> ${item.amount} coins</p>

          <p><strong>Method:</strong> ${item.method}</p>

          <p><strong>Payment Number:</strong> ${item.payment_number}</p>

          <p class="status">
            Status:
            ${item.status === "approved"
              ? "✅ APPROVED"
              : "❌ REJECTED"}
          </p>

          <p><strong>Requested:</strong> ${item.created_at}</p>

          <p><strong>Processed:</strong> ${item.processed_at || "N/A"}</p>

        </div>

      `).join("");

    }

  }catch(error){

    pendingBox.innerHTML = `
      <div class="request">
        ❌ Connection error.
      </div>
    `;

    historyBox.innerHTML = "";

  }

}


async function approve(id){

  if(!confirm("Approve this withdrawal?")) return;

  try{

    const response = await fetch(
      API + "/api/admin/withdrawals/" + id + "/approve",
      {
        method:"POST",
        headers:{
          "x-admin-key": adminKey
        }
      }
    );

    const data = await response.json();

    if(!response.ok){

      alert(
        "❌ " + (data.error || "Approve failed")
      );

      return;
    }

    alert("✅ Withdrawal approved.");

    loadRequests();

  }catch(error){

    alert("❌ Connection error.");

  }

}


async function reject(id){

  if(!confirm(
    "Reject this withdrawal? Coins will be refunded."
  )) return;

  try{

    const response = await fetch(
      API + "/api/admin/withdrawals/" + id + "/reject",
      {
        method:"POST",
        headers:{
          "x-admin-key": adminKey
        }
      }
    );

    const data = await response.json();

    if(!response.ok){

      alert(
        "❌ " + (data.error || "Reject failed")
      );

      return;
    }

    alert(
      "✅ Withdrawal rejected and coins refunded."
    );

    loadRequests();

  }catch(error){

    alert("❌ Connection error.");

  }

}

</script></body>
</html>
